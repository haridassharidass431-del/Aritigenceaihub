<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110524"/>
      <stop offset="50%" stop-color="#220d3f"/>
      <stop offset="100%" stop-color="#0d031c"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="hglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#hbg)"/>
  <circle cx="400" cy="190" r="100" fill="rgba(168, 85, 247, 0.2)" filter="url(#hglow)" />
  <circle cx="400" cy="190" r="70" fill="none" stroke="url(#purplePink)" stroke-width="2.5" stroke-dasharray="8 5"/>
  <circle cx="380" cy="180" r="34" fill="none" stroke="#e879f9" stroke-width="4" filter="url(#hglow)"/>
  <circle cx="420" cy="180" r="34" fill="none" stroke="#a855f7" stroke-width="4" filter="url(#hglow)"/>
  <polygon points="400,135 407,147 400,159 393,147" fill="#fbcfe8" filter="url(#hglow)"/>
  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3">HAVANA</text>
  <text x="400" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#c084fc" letter-spacing="1.5">WEDDING TECHNOLOGY PLATFORM</text>
  <text x="400" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">A future digital product by Artigence AI Hub</text>
  <rect x="330" y="395" width="140" height="24" rx="12" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1"/>
